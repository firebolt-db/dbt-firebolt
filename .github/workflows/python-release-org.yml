name: Firebolt Python Release

on:
  workflow_dispatch:
    inputs:
      pre-release-tag:
        required: false
        description: 'Tag for pre-release (optional)'
      major-release:
        required: false
        description: 'Trigger a major release (optional). Leave empty for regular release.'
      version:
        required: false
        description: 'Version to release (optional). Leave empty to auto-detect from commits.'
        default: ''

permissions: {}

jobs:
  integration-tests:
    uses: ./.github/workflows/integration-tests.yml
    with:
      use-cache: false # no cache restore/save in the release path (cache poisoning)
    permissions:
      contents: write # Allure Report (called workflow) publishes to gh-pages
      statuses: write # Allure Report (called workflow) sets the report commit status
      pages: read # Allure Report (called workflow) reads the GitHub Pages URL
    secrets:
      FIREBOLT_STG_USERNAME: ${{ secrets.FIREBOLT_STG_USERNAME }}
      FIREBOLT_STG_PASSWORD: ${{ secrets.FIREBOLT_STG_PASSWORD }}
      FIREBOLT_CLIENT_ID_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}

  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: integration-tests
    steps:
    - name: Create GitHub App token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      id: app-token
      with:
        client-id: ${{ secrets.GH_APP_FB_DB_CI_WRITER_CLIENT_ID }}
        private-key: ${{ secrets.GH_APP_FB_DB_CI_WRITER_APP_KEY_PEM }}
        permission-contents: write

    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: true # The changelog commit and the release step push to main and tag.

    - name: Validate version input
      env:
        VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$VERSION" ] && ! [[ "$VERSION" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Invalid version '$VERSION': expected empty or a semantic version like 1.2.3"
          exit 1
        fi
      shell: bash

    - name: Apply Changie changelog
      uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
      with:
        version: v1.10.2
        args: batch ${{ inputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Merge into CHANGELOG.md
      uses: miniscruff/changie-action@3223cb29b92a0972dedc864ace3da01e04780ae4 # v3.0.1
      with:
        version: v1.10.2
        args: merge
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup git config
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
      shell: bash

    - name: Commit changelog
      run: |
        git add .changes/
        git add CHANGELOG.md
        git commit -m "Changelog update"
        git push origin main

    - name: 'Publish action'
      uses: firebolt-db/action-python-release@4df4861ff745d6e2bbc602b2e8d6578d4f8dcf61 # v1.0.0
      with:
        pre-release-tag: ${{ inputs.pre-release-tag }}
        major-release: ${{ inputs.major-release }}
        pypi-username: ${{ secrets.PYPI_USERNAME }}
        pypi-password: ${{ secrets.PYPI_PASSWORD }}
        version-file-path: dbt/adapters/firebolt/__init__.py
        version-override: ${{ inputs.version }}
