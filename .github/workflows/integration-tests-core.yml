name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      python_version:
        description: 'Python version'
        required: false
        type: string
        default: '3.10'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
    secrets:
      SLACK_BOT_TOKEN:
        required: false

permissions: {}

jobs:
  run-core-integration-tests:
    runs-on: ${{ inputs.os_name }}
    permissions:
      contents: write # Allure Report publishes to gh-pages
      statuses: write # Allure Report sets the report commit status
      pages: read # Allure Report reads the GitHub Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-cache-dir

      - name: Setup Firebolt Core
        id: setup-core
        uses: firebolt-db/action-setup-core@5adec87419b62523e77ca1a1affe9411809738a5 # v1.1.0
        with:
          tag_version: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}

      - name: Run integration tests
        env:
          SERVICE_ID: ""
          SERVICE_SECRET: ""
          DATABASE_NAME: "firebolt"
          ENGINE_NAME: ""
          API_ENDPOINT: ""
          ACCOUNT_NAME: ""
          CORE_URL: ${{ steps.setup-core.outputs.service_url }}
        run: |
          pytest --last-failed -o log_cli=true -o log_cli_level=INFO tests/functional/ --alluredir=allure-results

      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        if: always()
        continue-on-error: true
        with:
          github-key: ${{ secrets.GITHUB_TOKEN }}
          test-type: core
          allure-dir: allure-results
          pages-branch: gh-pages
          repository-name: dbt-firebolt
