name: Run integration tests V1

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: 'Restore and save the pytest failed-tests cache'
        type: boolean
        default: true
  workflow_call:
    inputs:
      use-cache:
        description: 'Restore and save the pytest failed-tests cache (the release passes false)'
        type: boolean
        default: true
    secrets:
      FIREBOLT_STG_USERNAME:
        required: true
      FIREBOLT_STG_PASSWORD:
        required: true

permissions: {}

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allure Report publishes to gh-pages
      statuses: write # Allure Report sets the report commit status
      pages: read # Allure Report reads the GitHub Pages URL
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" --no-cache-dir

      - name: Setup database and engine
        id: setup
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-username: ${{ secrets.FIREBOLT_STG_USERNAME }}
          firebolt-password: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          api-endpoint: "api.staging.firebolt.io"
          region: "us-east-1"

      - name: Restore cached failed tests
        id: cache-tests-restore
        if: inputs.use-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ runner.os }}-pytest-restore-failed-${{ github.ref }}-${{ github.sha }}-v1

      - name: Run integration tests
        env:
          USER_NAME: ${{ secrets.FIREBOLT_STG_USERNAME }}
          PASSWORD: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          DATABASE_NAME: ${{ steps.setup.outputs.database_name }}
          ENGINE_NAME: ${{ steps.setup.outputs.engine_name }}
          API_ENDPOINT: "api.staging.firebolt.io"
          ACCOUNT_NAME: "firebolt"
        run: |
          pytest --last-failed -o log_cli=true -o log_cli_level=WARNING tests/functional/ --alluredir=allure-results

      - name: Make sure no secrets make it to the logs
        if: always()
        env:
          SECRET_1: ${{ secrets.FIREBOLT_STG_USERNAME }}
          SECRET_2: ${{ secrets.FIREBOLT_STG_PASSWORD }}
        # Read the secrets from the environment so they never appear on a command line.
        run: |
          python3 - <<'EOF'
          import os
          import pathlib

          secrets = [os.environ[name].encode() for name in ("SECRET_1", "SECRET_2")]
          for path in pathlib.Path("allure-results").rglob("*"):
              if not path.is_file():
                  continue
              data = original = path.read_bytes()
              for secret in secrets:
                  if secret:
                      data = data.replace(secret, b"REDACTED")
              if data != original:
                  path.write_bytes(data)
          EOF

      - name: Save failed tests
        id: cache-tests-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: failure() && inputs.use-cache
        with:
          path: |
            .pytest_cache/v/cache/lastfailed
          key: ${{ steps.cache-tests-restore.outputs.cache-primary-key }}

      # action-allure-report v2 checks out the pages branch for the history itself.
      - name: Allure Report
        uses: firebolt-db/action-allure-report@39037f1a56d995af294067c7c5ceb5713c407274 # v2.1.2
        if: always()
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "allure-results": "integration-v1"
            }
